<!-- ================= HEADER MEXA ================= -->

<header class="mx-app-header">

  <div class="mx-brand" aria-label="MEXA">

    </span>

  </div>



  <div class="mx-search-box">

    <span aria-hidden="true">

    <input
      type="search"
      placeholder="Cari di MEXA"
      aria-label="Cari di MEXA"

  </div>



  <div class="mx-header-buttons">

    <button
      type="button"
      id="mx-notification"
      aria-label="Notifikasi">
      ♢

    <a href="Messenger.html"

    <a href="Profil.html"
       aria-label="Profil">
       ♙

    <button
      type="button"
      id="mx-main-menu"
      aria-label="Buka menu"
      aria-controls="mx-control-panel">

      ☰

    </button>


  </div>

</header>





<!-- ================= MENU KONTROL ================= -->


<div id="mx-control-panel" hidden>


<button type="button">
⌂ Beranda
</button>

<section
class="mx-card"
id="mexa-stories">

<h2>
Cerita
</h2>


<button type="button">
Segarkan
</button>


</div>


<div id="mexa-story-list">

</div>


</section>







<!-- BUAT POSTINGAN -->


<section
class="mx-card"
id="mexa-composer">


<h2>
Buat postingan
</h2>



<textarea
id="mexaPostContent"
rows="4"
placeholder="Apa yang ingin kamu bagikan?"
aria-label="Isi postingan">
</textarea>





<div class="mx-create-buttons">


<button type="button">
📷 Foto
</button>


<button type="button">
🎬 Video
</button>


<button type="button">
😊 Perasaan
</button>



</div>




<button
type="button"
id="mexaPostButton">

Posting

</button>



</section>








<!-- FEED -->


<section
class="mx-card"
id="mexa-home-posts">


<div class="mx-title">


<h2>
Beranda MEXA
</h2>


</div>



<div id="mexaFeedList">

<!-- DATA POST MASUK DI SINI -->

</div>



</section>





</main>
