<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0818">
  <title>MEXA — Home</title>
  <link rel="stylesheet" href="./home.css">
  <link rel="stylesheet" href="./home-theme.css">
</head>
<body>
  <div id="mexa-app">
    <header id="mexa-header" class="mx-header">
      <a class="mx-brand" href="./index.html" aria-label="MEXA Home">
        <span class="mx-logo-m">M</span><span class="mx-logo-e">
          <i></i><i></i><i></i>
        </span><span class="mx-logo-x">X</span><span class="mx-logo-a">A</span>
      </a>

      <label class="mx-search">
        <span>⌕</span>
        <input id="mexaSearch" type="search"
          placeholder="Cari di MEXA..." aria-label="Cari di MEXA">
      </label>

      <div class="mx-header-actions">
        <button type="button" data-action="notifications"
          aria-label="Notifikasi">♢</button>
        <a href="./Messenger.html" aria-label="Pesan">💬</a>
        <a href="./Profil.html" aria-label="Profil">♙</a>
        <button type="button" id="mexaMenuToggle"
          aria-controls="mexaQuickMenuPanel"
          aria-expanded="false" aria-label="Buka menu">☰</button>
      </div>
    </header>

    <div id="mexaQuickMenuPanel" class="mx-dropdown" hidden>
      <button type="button" data-page="home">⌂ Beranda</button>
      <button type="button" data-page="profile">◯ Profil</button>
      <button type="button" data-page="reels">▶ Reels</button>
      <button type="button" data-action="settings">⚙ Pengaturan</button>
      <button type="button" data-action="core">✦ MEXA Core</button>
      <button type="button" data-action="logout">⇥ Keluar Akun</button>
    </div>

    <div class="mx-layout">
      <aside id="mexa-sidebar" class="mx-sidebar">
        <div id="mexa-sidebar-profile"></div>
        <nav id="mexa-side-navigation"></nav>
      </aside>

      <main id="mexa-main">
        <section id="mexa-stories" aria-label="Cerita">
          <div class="mx-section-heading">
            <h2>Cerita</h2>
            <button type="button" data-action="refresh-stories">
              Segarkan
            </button>
          </div>
          <div id="mexa-stories-list"></div>
        </section>

<section id="mexa-composer" class="mx-composer" aria-label="Buat postingan">
  <div id="mexa-composer-profile"></div>

  <label class="mx-composer-label" for="mexaPostContent">
    Buat postingan baru
  </label>

  <textarea
    id="mexaPostContent"
    name="content"
    placeholder="Apa yang ingin kamu bagikan?"
    rows="3"
    maxlength="10000"
  ></textarea>

  <div class="mx-composer-actions">
    <button type="button" data-create="photo">📷 Foto</button>
    <button type="button" data-create="video">🎬 Video</button>
    <button type="button" data-create="feeling">😊 Perasaan</button>
  </div>

  <div class="mx-publish-row">
    <span id="mexaPublishStatus" role="status">
      Bagikan cerita kamu ke MEXA
    </span>

    <button type="button" id="mexaPublishPost">
      Posting
    </button>
  </div>
</section>

    <nav id="mexa-bottom-nav" aria-label="Navigasi utama">
      <a href="./index.html">⌂<span>Home</span></a>
      <a href="./Reels.html">▶<span>Reels</span></a>
      <button type="button" id="mexaMobileCreate">＋<span>Buat</span></button>
      <a href="./Grup.html">♧<span>Grup</span></a>
      <a href="./Profil.html">◯<span>Profil</span></a>
    </nav>
  </div>

<!-- SUPABASE SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- KONEKSI SUPABASE MEXA -->
<script src="./auth-client.js"></script>

<!-- PENJAGA HALAMAN HOME -->
<script>
(async function () {
  const app = document.getElementById("mexa-app");

  if (app) {
    app.style.visibility = "hidden";
  }

  try {
    if (!window.mexaSupabase?.auth) {
      throw new Error("Klien autentikasi MEXA belum tersedia.");
    }

    const { data, error } =
      await window.mexaSupabase.auth.getSession();

    if (error || !data?.session?.user) {
      window.location.replace("./Login.html");
      return;
    }

    if (app) {
      app.style.visibility = "visible";
    }
  } catch (error) {
    console.error("MEXA penjaga login:", error);
    window.location.replace("./Login.html");
  }
})();
</script>

<!-- FILE HOME -->
<script src="./home.js"></script>

<!-- FITUR POSTINGAN -->
<script src="./functions-post.js"></script>
<script src="./functions-feed.js"></script>
<script src="./post-create.js"></script>

<!-- FITUR LAINNYA -->
<script src="./post-menu.js"></script>
<script src="./post-share.js"></script>
<script src="./komentar-premium.js"></script>
<script src="./mexa-core.js"></script>
<script src="./post-owner-fix.js"></script>
<script src="./functions-feed.js"></script>
<script src="./themes.js"></script>
<script src="./logout.js"></script>
<script src="./js/functions-post-feed.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.MEXAPostFeed) {
    window.MEXAPostFeed.loadHome("#homeFeed")
      .catch(function (error) {
        console.error("MEXA Home Feed:", error);
      });
  }
});
</script>
</body>
  </html>
