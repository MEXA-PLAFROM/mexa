<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Teman — MEXA</title> <style> /* ===================================================== MEXA HOME THEME ===================================================== */ * { box-sizing: border-box; } html, body { margin: 0; padding: 0; min-height: 100%; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f4f6f8; color: #17191c; } body { overflow-x: hidden; } /* ===================================================== BACKGROUND ===================================================== */ body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: radial-gradient( circle at 15% 5%, rgba(255, 49, 92, .07), transparent 28% ), radial-gradient( circle at 90% 10%, rgba(80, 110, 255, .06), transparent 28% ), #f4f6f8; } /* ===================================================== HEADER ===================================================== */ .mexa-friends-header { position: sticky; top: 0; z-index: 100; height: 68px; display: flex; align-items: center; gap: 13px; padding: 0 18px; background: rgba(255,255,255,.88); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border-bottom: 1px solid rgba(0,0,0,.06); box-shadow: 0 2px 14px rgba(0,0,0,.035); } /* ===================================================== BACK BUTTON ===================================================== */ .mexa-back { width: 42px; height: 42px; flex: 0 0 42px; border: 1px solid rgba(0,0,0,.06); border-radius: 14px; background: #f0f2f5; color: #17191c; font-size: 23px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .16s ease, background .16s ease; } .mexa-back:hover { background: #e8eaee; } .mexa-back:active { transform: scale(.94); } /* ===================================================== MEXA LOGO ===================================================== */ .mexa-logo { display: flex; align-items: center; height: 30px; font-size: 23px; font-weight: 900; letter-spacing: -1.5px; user-select: none; } .mexa-logo-m, .mexa-logo-a { color: #17191c; } /* X khas MEXA */ .mexa-logo-x { color: #ff315c; } /* E = tepat 3 strip */ .mexa-logo-e { display: inline-flex; flex-direction: column; justify-content: center; gap: 3px; width: 14px; height: 20px; margin: 0 2px; } .mexa-logo-e span { display: block; width: 14px; height: 3px; border-radius: 4px; background: currentColor; } /* ===================================================== PAGE TITLE ===================================================== */ .mexa-page-title { font-size: 18px; font-weight: 800; color: #17191c; padding-left: 2px; } /* ===================================================== CONTENT ===================================================== */ .mexa-friends-container { width: min(680px, 100%); margin: 0 auto; padding: 24px 16px 110px; } /* ===================================================== HEADING ===================================================== */ .mexa-heading { margin-bottom: 18px; } .mexa-heading h1 { margin: 0; font-size: 27px; line-height: 1.15; font-weight: 850; letter-spacing: -.5px; } .mexa-heading p { margin: 7px 0 0; font-size: 14px; line-height: 1.45; color: #70757d; } /* ===================================================== SEARCH ===================================================== */ .mexa-search { width: 100%; border: 1px solid rgba(0,0,0,.045); outline: none; padding: 14px 17px; border-radius: 16px; background: #ffffff; color: #17191c; font-size: 15px; margin-bottom: 17px; box-shadow: 0 3px 14px rgba(0,0,0,.035); transition: border-color .16s ease, box-shadow .16s ease, background .16s ease; } .mexa-search::placeholder { color: #969ba3; } .mexa-search:focus { background: #fff; border-color: rgba(255,49,92,.28); box-shadow: 0 0 0 4px rgba(255,49,92,.07), 0 4px 18px rgba(0,0,0,.04); } /* ===================================================== FRIEND LIST ===================================================== */ .mexa-friends-list { display: flex; flex-direction: column; gap: 9px; } /* ===================================================== FRIEND CARD ===================================================== */ .mexa-friend { display: flex; align-items: center; gap: 13px; padding: 12px; min-height: 74px; border-radius: 18px; background: rgba(255,255,255,.96); border: 1px solid rgba(0,0,0,.045); box-shadow: 0 3px 15px rgba(0,0,0,.035); cursor: pointer; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease; } .mexa-friend:hover { transform: translateY(-1px); box-shadow: 0 7px 22px rgba(0,0,0,.07); } .mexa-friend:active { transform: scale(.985); } /* ===================================================== SELECTED FRIEND ===================================================== */ .mexa-friend.selected { border-color: rgba(255,49,92,.25); background: linear-gradient( 135deg, rgba(255,49,92,.045), rgba(255,255,255,.98) ); box-shadow: 0 5px 20px rgba(255,49,92,.08); } /* ===================================================== AVATAR ===================================================== */ .mexa-avatar { width: 50px; height: 50px; flex: 0 0 50px; border-radius: 50%; object-fit: cover; background: #e5e7eb; border: 1px solid rgba(0,0,0,.06); } /* ===================================================== FRIEND INFO ===================================================== */ .mexa-friend-info { min-width: 0; flex: 1; } .mexa-friend-name { font-size: 15px; font-weight: 800; color: #17191c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .mexa-friend-username { margin-top: 4px; font-size: 13px; color: #7b8088; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* ===================================================== SELECT CIRCLE ===================================================== */ .mexa-select { width: 25px; height: 25px; flex: 0 0 25px; border: 2px solid #c9cdd3; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff; transition: .16s ease; } .mexa-friend.selected .mexa-select { border-color: #ff315c; background: #ff315c; color: #fff; box-shadow: 0 3px 10px rgba(255,49,92,.25); } .mexa-friend.selected .mexa-select::after { content: "✓"; font-size: 14px; line-height: 1; font-weight: 900; } /* ===================================================== EMPTY STATE ===================================================== */ .mexa-empty { text-align: center; padding: 70px 20px; border-radius: 22px; background: rgba(255,255,255,.78); border: 1px solid rgba(0,0,0,.045); box-shadow: 0 5px 20px rgba(0,0,0,.035); } .mexa-empty-icon { width: 62px; height: 62px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: linear-gradient( 135deg, rgba(255,49,92,.10), rgba(255,49,92,.035) ); font-size: 31px; } .mexa-empty-title { font-size: 17px; font-weight: 800; color: #292c31; } .mexa-empty-text { max-width: 390px; margin: 7px auto 0; font-size: 14px; line-height: 1.5; color: #7a7f87; } /* ===================================================== SEND BAR ===================================================== */ .mexa-send-bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(15px); width: min( 650px, calc(100% - 30px) ); padding: 10px; background: rgba(255,255,255,.88); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(0,0,0,.06); border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.15); display: none; z-index: 200; opacity: 0; transition: opacity .18s ease, transform .18s ease; } .mexa-send-bar.active { display: block; opacity: 1; transform: translateX(-50%) translateY(0); } /* ===================================================== SEND BUTTON ===================================================== */ .mexa-send-button { width: 100%; border: 0; border-radius: 15px; padding: 14px 16px; background: linear-gradient( 135deg, #ff315c, #ff1747 ); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 18px rgba(255,49,92,.22); transition: transform .16s ease, box-shadow .16s ease; } .mexa-send-button:hover { box-shadow: 0 8px 24px rgba(255,49,92,.28); } .mexa-send-button:active { transform: scale(.985); } /* ===================================================== MOBILE ===================================================== */ @media (max-width: 600px) { .mexa-friends-header { height: 62px; padding: 0 12px; gap: 10px; } .mexa-back { width: 40px; height: 40px; flex-basis: 40px; border-radius: 13px; font-size: 22px; } .mexa-logo { font-size: 21px; } .mexa-page-title { font-size: 17px; } .mexa-friends-container { padding: 19px 12px 105px; } .mexa-heading h1 { font-size: 24px; } .mexa-heading p { font-size: 13px; } .mexa-friend { padding: 11px; min-height: 70px; border-radius: 17px; } .mexa-avatar { width: 47px; height: 47px; flex-basis: 47px; } .mexa-empty { padding: 60px 16px; } .mexa-send-bar { bottom: 12px; width: calc(100% - 24px); } } /* ===================================================== SMALL MOBILE ===================================================== */ @media (max-width: 380px) { .mexa-logo { font-size: 20px; } .mexa-page-title { font-size: 16px; } .mexa-heading h1 { font-size: 23px; } } </style> </head> <body> <!-- ===================================================== HEADER ===================================================== --> <header class="mexa-friends-header"> <button class="mexa-back" type="button" onclick="backToHome()" aria-label="Kembali ke Home" > ← </button> <div class="mexa-logo"> <span class="mexa-logo-m">M</span> <!-- E = tepat 3 strip --> <span class="mexa-logo-e"> <span></span> <span></span> <span></span> </span> <span class="mexa-logo-x">X</span> <span class="mexa-logo-a">A</span> </div> <div class="mexa-page-title"> Teman </div> </header> <!-- ===================================================== CONTENT ===================================================== --> <main class="mexa-friends-container"> <div class="mexa-heading"> <h1> Teman </h1> <p> Pilih teman untuk membagikan postingan MEXA. </p> </div> <input id="friendSearch" class="mexa-search" type="search" placeholder="Cari teman..." autocomplete="off" > <div id="friendsList" class="mexa-friends-list" > <div class="mexa-empty"> <div class="mexa-empty-icon"> 👥 </div> <div class="mexa-empty-title"> Teman MEXA </div> <div class="mexa-empty-text"> Daftar teman akan muncul otomatis setelah sistem pertemanan MEXA aktif. </div> </div> </div> </main> <!-- ===================================================== SEND BAR ===================================================== --> <div id="sendBar" class="mexa-send-bar" > <button id="sendButton" class="mexa-send-button" type="button" onclick="sendPostToFriends()" > Kirim postingan </button> </div> <script> /* ===================================================== MEXA — DATA POSTINGAN YANG DIBAGIKAN ===================================================== */ const params = new URLSearchParams( window.location.search ); const postId = params.get("post_id") || null; /* ===================================================== MEXA — DATA TEMAN NANTI AKAN DIISI OTOMATIS DARI DATABASE ===================================================== */ let mexaFriends = []; let selectedFriends = []; /* ===================================================== KEMBALI KE HOME ===================================================== */ function backToHome() { if ( document.referrer && document.referrer.includes( window.location.hostname ) ) { history.back(); return; } window.location.href = "index.html"; } /* ===================================================== TAMPILKAN TEMAN ===================================================== */ function renderFriends() { const list = document.getElementById( "friendsList" ); if (!list) return; if (!mexaFriends.length) { list.innerHTML = ` <div class="mexa-empty"> <div class="mexa-empty-icon"> 👥 </div> <div class="mexa-empty-title"> Belum ada teman </div> <div class="mexa-empty-text"> Teman yang sudah terhubung dengan akunmu akan muncul otomatis di sini. </div> </div> `; return; } list.innerHTML = mexaFriends.map(friend => { const selected = selectedFriends.includes( friend.id ); return ` <div class="mexa-friend ${ selected ? "selected" : "" }" onclick="toggleFriend('${friend.id}')" > <img class="mexa-avatar" src="${ friend.avatar || "https://via.placeholder.com/100" }" alt="" > <div class="mexa-friend-info"> <div class="mexa-friend-name"> ${escapeHTML( friend.name || "Pengguna MEXA" )} </div> <div class="mexa-friend-username"> ${ friend.username ? "@" + escapeHTML(friend.username) : "" } </div> </div> <div class="mexa-select"></div> </div> `; }).join(""); } /* ===================================================== PILIH TEMAN ===================================================== */ function toggleFriend(friendId) { const index = selectedFriends.indexOf( friendId ); if (index >= 0) { selectedFriends.splice( index, 1 ); } else { selectedFriends.push( friendId ); } updateSendBar(); renderFriends(); } /* ===================================================== TOMBOL KIRIM ===================================================== */ function updateSendBar() { const bar = document.getElementById( "sendBar" ); const button = document.getElementById( "sendButton" ); if (!bar || !button) return; if (!selectedFriends.length) { bar.classList.remove( "active" ); return; } bar.classList.add( "active" ); button.textContent = `Kirim postingan ke ${selectedFriends.length} teman`; } /* ===================================================== KIRIM POSTINGAN ===================================================== */ function sendPostToFriends() { if (!postId) { alert( "Postingan yang akan dibagikan tidak ditemukan." ); return; } if (!selectedFriends.length) { return; } /* * BACKEND PENGIRIMAN AKAN KITA SAMBUNG * SETELAH SISTEM TEMAN SELESAI. */ console.log( "MEXA SHARE POST:", { post_id: postId, friend_ids: selectedFriends } ); alert( "Pilihan teman sudah siap. Sistem pengiriman MEXA akan disambungkan berikutnya." ); } /* ===================================================== PENCARIAN TEMAN ===================================================== */ document .getElementById( "friendSearch" ) ?.addEventListener( "input", function () { const keyword = this.value .toLowerCase() .trim(); if (!keyword) { renderFriends(); return; } const filtered = mexaFriends.filter( friend => String( friend.name || "" ) .toLowerCase() .includes(keyword) || String( friend.username || "" ) .toLowerCase() .includes(keyword) ); const original = mexaFriends; mexaFriends = filtered; renderFriends(); mexaFriends = original; } ); /* ===================================================== ESCAPE HTML ===================================================== */ function escapeHTML(value) { return String(value ?? "") .replaceAll("&", "&amp;") .replaceAll("<", "&lt;") .replaceAll(">", "&gt;") .replaceAll('"', "&quot;") .replaceAll("'", "&#039;"); } /* ===================================================== START ===================================================== */ renderFriends(); </script> </body> </html>
