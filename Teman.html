<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teman • MEXA</title>

<style>
:root{
  --mx-bg:#f4f6f8;
  --mx-card:rgba(255,255,255,.88);
  --mx-text:#111827;
  --mx-muted:#6b7280;
  --mx-border:rgba(17,24,39,.08);
  --mx-main:#111827;
  --mx-x:#ff3158;
  --mx-shadow:0 12px 35px rgba(17,24,39,.08);
  --mx-radius:24px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(
      circle at top left,
      rgba(255,49,88,.08),
      transparent 32%
    ),
    var(--mx-bg);
  color:var(--mx-text);
}

body{
  min-height:100vh;
}

/* =========================
   HEADER
   ========================= */

.mexa-header{
  position:sticky;
  top:0;
  z-index:1000;

  width:100%;

  background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-bottom:1px solid var(--mx-border);
}

.mexa-header-inner{
  width:min(1180px, calc(100% - 28px));
  min-height:72px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

/* =========================
   MEXA LOGO
   ========================= */

.mexa-logo{
  display:flex;
  align-items:center;
  gap:2px;

  text-decoration:none;
  user-select:none;
}

.mexa-letter{
  font-weight:950;
  font-size:28px;
  line-height:1;

  letter-spacing:-3px;

  color:#111827;
}

.mexa-x{
  color:#ff3158;
}

/*
   E MEXA dibuat dari tepat
   3 strip horizontal.
*/

.mexa-e{
  width:18px;
  height:23px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  margin:0 1px;
}

.mexa-e span{
  display:block;
  width:100%;
  height:4px;

  border-radius:3px;
  background:#111827;
}

.mexa-e span:nth-child(2){
  width:78%;
}

.mexa-e span:nth-child(3){
  width:100%;
}

.mexa-logo-sub{
  margin-left:8px;

  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;

  color:#9ca3af;
}

/* =========================
   BACK BUTTON
   ========================= */

.back-btn{
  border:0;
  outline:0;

  display:flex;
  align-items:center;
  gap:8px;

  padding:11px 16px;

  border-radius:14px;

  background:#fff;
  color:#111827;

  font-weight:800;
  font-size:13px;

  cursor:pointer;

  box-shadow:
    0 5px 18px rgba(17,24,39,.07);

  transition:.2s ease;
}

.back-btn:hover{
  transform:translateY(-1px);
}

.back-btn:active{
  transform:scale(.97);
}

/* =========================
   MAIN
   ========================= */

.mexa-page{
  width:min(1180px, calc(100% - 28px));
  margin:0 auto;
  padding:28px 0 110px;
}

.hero-card{
  position:relative;
  overflow:hidden;

  padding:30px;

  border-radius:30px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.96),
      rgba(255,255,255,.76)
    );

  border:1px solid rgba(255,255,255,.9);

  box-shadow:var(--mx-shadow);
}

.hero-card::after{
  content:"";

  position:absolute;
  width:230px;
  height:230px;

  right:-80px;
  top:-100px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,49,88,.12),
      transparent 68%
    );

  pointer-events:none;
}

.hero-title{
  position:relative;
  z-index:1;

  margin:0;

  font-size:clamp(27px,4vw,42px);
  font-weight:950;

  letter-spacing:-1.5px;
}

.hero-title span{
  color:var(--mx-x);
}

.hero-description{
  position:relative;
  z-index:1;

  max-width:650px;

  margin:9px 0 0;

  color:var(--mx-muted);

  font-size:14px;
  line-height:1.6;
}

/* =========================
   SEARCH
   ========================= */

.search-box{
  margin-top:22px;

  display:flex;
  align-items:center;
  gap:12px;

  padding:5px 16px;

  background:#fff;

  border:1px solid var(--mx-border);

  border-radius:18px;

  box-shadow:
    0 8px 24px rgba(17,24,39,.05);
}

.search-icon{
  font-size:18px;
  opacity:.65;
}

#friendSearch{
  width:100%;

  border:0;
  outline:0;

  padding:12px 0;

  background:transparent;

  color:var(--mx-text);

  font-size:14px;
  font-weight:600;
}

#friendSearch::placeholder{
  color:#9ca3af;
}

/* =========================
   SECTION
   ========================= */

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;

  gap:15px;

  margin:28px 2px 14px;
}

.section-title{
  margin:0;

  font-size:19px;
  font-weight:900;
  letter-spacing:-.4px;
}

.section-count{
  color:#9ca3af;

  font-size:12px;
  font-weight:800;
}

/* =========================
   FRIEND GRID
   ========================= */

.friend-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:16px;
}

.friend-card{
  position:relative;

  display:flex;
  align-items:center;

  gap:13px;

  min-width:0;

  padding:17px;

  background:var(--mx-card);

  border:1px solid var(--mx-border);

  border-radius:22px;

  box-shadow:
    0 8px 25px rgba(17,24,39,.055);

  cursor:pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease,
    background .2s ease;
}

.friend-card:hover{
  transform:translateY(-2px);

  box-shadow:
    0 15px 32px rgba(17,24,39,.09);
}

.friend-card.selected{
  border-color:rgba(255,49,88,.55);

  background:
    linear-gradient(
      135deg,
      rgba(255,49,88,.08),
      rgba(255,255,255,.95)
    );
}

.friend-avatar-wrap{
  position:relative;
  flex:0 0 auto;
}

.friend-avatar{
  width:52px;
  height:52px;

  border-radius:17px;

  object-fit:cover;

  display:block;

  background:#eef0f3;

  border:2px solid #fff;

  box-shadow:
    0 5px 14px rgba(17,24,39,.12);
}

.friend-online{
  position:absolute;

  right:-2px;
  bottom:-2px;

  width:13px;
  height:13px;

  border-radius:50%;

  background:#21c779;

  border:3px solid #fff;
}

.friend-info{
  min-width:0;
  flex:1;
}

.friend-name{
  overflow:hidden;

  text-overflow:ellipsis;
  white-space:nowrap;

  font-size:14px;
  font-weight:900;
}

.friend-username{
  overflow:hidden;

  text-overflow:ellipsis;
  white-space:nowrap;

  margin-top:3px;

  color:#9ca3af;

  font-size:11px;
  font-weight:700;
}

.friend-check{
  width:30px;
  height:30px;

  flex:0 0 auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:1.5px solid #d9dde3;

  color:transparent;

  font-size:14px;
  font-weight:900;
}

.friend-card.selected .friend-check{
  border-color:var(--mx-x);

  background:var(--mx-x);

  color:#fff;
}

/* =========================
   EMPTY / LOADING
   ========================= */

.state-box{
  grid-column:1/-1;

  padding:48px 20px;

  text-align:center;

  background:#fff;

  border:1px solid var(--mx-border);

  border-radius:24px;

  color:var(--mx-muted);
}

.state-icon{
  font-size:35px;
  margin-bottom:10px;
}

.state-title{
  margin:0 0 5px;

  color:var(--mx-text);

  font-size:16px;
  font-weight:900;
}

.state-text{
  margin:0;

  font-size:13px;
  line-height:1.5;
}

/* =========================
   SEND BAR
   ========================= */

.send-bar{
  position:fixed;

  z-index:1500;

  left:50%;
  bottom:18px;

  width:min(650px, calc(100% - 28px));

  transform:
    translate(-50%, 130px);

  display:flex;
  align-items:center;
  gap:12px;

  padding:11px 12px 11px 17px;

  background:
    rgba(17,24,39,.94);

  border:1px solid rgba(255,255,255,.08);

  border-radius:20px;

  box-shadow:
    0 20px 50px rgba(0,0,0,.22);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  transition:.25s ease;
}

.send-bar.show{
  transform:translate(-50%,0);
}

.send-info{
  min-width:0;
  flex:1;

  color:#fff;
}

.send-title{
  font-size:12px;
  font-weight:900;
}

.send-subtitle{
  margin-top:2px;

  color:rgba(255,255,255,.58);

  font-size:10px;
}

.send-button{
  border:0;
  outline:0;

  padding:12px 18px;

  border-radius:14px;

  background:var(--mx-x);
  color:#fff;

  font-size:12px;
  font-weight:900;

  cursor:pointer;

  transition:.2s ease;
}

.send-button:active{
  transform:scale(.96);
}

.send-button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* =========================
   TOAST
   ========================= */

.mexa-toast{
  position:fixed;

  z-index:3000;

  left:50%;
  bottom:90px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  padding:12px 17px;

  max-width:
    calc(100% - 40px);

  border-radius:15px;

  background:#111827;
  color:#fff;

  font-size:12px;
  font-weight:800;

  box-shadow:
    0 15px 35px rgba(0,0,0,.18);

  transition:.25s ease;
}

.mexa-toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   RESPONSIVE
   ========================= */

@media(max-width:850px){

  .friend-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

@media(max-width:600px){

  .mexa-header-inner{
    min-height:64px;
  }

  .mexa-logo-sub{
    display:none;
  }

  .mexa-letter{
    font-size:25px;
  }

  .mexa-page{
    width:min(100% - 20px,1180px);
    padding-top:15px;
  }

  .hero-card{
    padding:23px 18px;
    border-radius:24px;
  }

  .hero-title{
    font-size:28px;
  }

  .friend-grid{
    grid-template-columns:1fr;
  }

  .friend-card{
    padding:15px;
  }

  .back-btn{
    padding:10px 12px;
  }

  .back-btn span{
    display:none;
  }
}
</style>
</head>

<body>

<header class="mexa-header">

  <div class="mexa-header-inner">

    <a
      class="mexa-logo"
      href="index.html"
      aria-label="MEXA Home"
    >

      <span class="mexa-letter">M</span>

      <span class="mexa-e">
        <span></span>
        <span></span>
        <span></span>
      </span>

      <span class="mexa-letter mexa-x">X</span>

      <span class="mexa-letter">A</span>

      <span class="mexa-logo-sub">
        SOCIAL
      </span>

    </a>

    <button
      class="back-btn"
      type="button"
      onclick="backToHome()"
    >
      ← <span>Kembali</span>
    </button>

  </div>

</header>


<main class="mexa-page">

  <section class="hero-card">

    <h1 class="hero-title">
      Teman <span>MEXA</span>
    </h1>

    <p class="hero-description">
      Pilih teman MEXA yang ingin menerima postingan ini.
      Daftar teman dibuat otomatis dari pengguna yang
      saling mengikuti.
    </p>

    <div class="search-box">

      <div class="search-icon">
        🔎
      </div>

      <input
        id="friendSearch"
        type="search"
        autocomplete="off"
        placeholder="Cari nama teman..."
      >

    </div>

  </section>


  <div class="section-head">

    <h2 class="section-title">
      Teman kamu
    </h2>

    <div
      id="friendCount"
      class="section-count"
    >
      0 teman
    </div>

  </div>


  <section
    id="friendGrid"
    class="friend-grid"
  >

    <div class="state-box">

      <div class="state-icon">
        ✨
      </div>

      <p class="state-title">
        Memuat teman MEXA
      </p>

      <p class="state-text">
        Sedang mengambil daftar teman kamu...
      </p>

    </div>

  </section>

</main>


<div
  id="sendBar"
  class="send-bar"
>

  <div class="send-info">

    <div
      id="sendTitle"
      class="send-title"
    >
      Belum memilih teman
    </div>

    <div
      id="sendSubtitle"
      class="send-subtitle"
    >
      Pilih satu atau beberapa teman
    </div>

  </div>

  <button
    id="sendButton"
    class="send-button"
    type="button"
    onclick="sendPostToFriends()"
    disabled
  >
    Kirim
  </button>

</div>


<div
  id="mexaToast"
  class="mexa-toast"
></div>


<script>

/* =========================================================
   MEXA API
   ========================================================= */


const MEXA_SUPABASE_URL =
  "https://yozylignolfvkemuhfse.supabase.co";

const MEXA_API =
  `${MEXA_SUPABASE_URL}/functions/v1/mexa-api`;

/* =========================================================
   URL POST
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const postId =
  params.get("post_id") ||
  params.get("postId") ||
  null;


/* =========================================================
   DATA
   ========================================================= */

let mexaFriends = [];

let selectedFriends = [];

let currentUserId = null;


/* =========================================================
   API
   ========================================================= */

async function mexaAPI(
  action,
  body = {}
){

  try{

    const response =
      await fetch(
        MEXA_API,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              action,
              ...body
            })
        }
      );

    const data =
      await response.json();

    return data;

  }catch(error){

    console.error(
      "MEXA API ERROR:",
      error
    );

    return {
      success:false,
      error:
        "Gagal menghubungi server MEXA."
    };
  }
}


/* =========================================================
   AMBIL USER LOGIN OTOMATIS
   ========================================================= */

function getCurrentUserId(){

  /*
   * Kita cek beberapa format umum
   * supaya sistem tidak membutuhkan
   * input ID manual.
   */

  const possibleKeys = [
    "mexa_user",
    "mexaUser",
    "currentUser",
    "current_user",
    "user",
    "profile",
    "mexa_profile",
    "mexaProfile"
  ];

  for(
    const key of possibleKeys
  ){

    try{

      const raw =
        localStorage.getItem(key);

      if(!raw) continue;

      /*
       * Bisa berupa UUID langsung
       */

      if(
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
          .test(raw.trim())
      ){

        return raw.trim();
      }


      /*
       * Bisa berupa object JSON
       */

      const data =
        JSON.parse(raw);

      const id =
        data?.id ||
        data?.user_id ||
        data?.userId ||
        data?.profile?.id ||
        data?.user?.id ||
        null;

      if(id){

        return id;
      }

    }catch(error){

      /*
       * Bukan JSON.
       * Lanjut cek key berikutnya.
       */

    }
  }


  /*
   * Cek sessionStorage juga.
   */

  for(
    const key of possibleKeys
  ){

    try{

      const raw =
        sessionStorage.getItem(key);

      if(!raw) continue;

      if(
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
          .test(raw.trim())
      ){

        return raw.trim();
      }

      const data =
        JSON.parse(raw);

      const id =
        data?.id ||
        data?.user_id ||
        data?.userId ||
        data?.profile?.id ||
        data?.user?.id ||
        null;

      if(id){

        return id;
      }

    }catch(error){

    }
  }


  return null;
}


/* =========================================================
   LOAD TEMAN
   ========================================================= */

async function loadFriends(){

  const grid =
    document.getElementById(
      "friendGrid"
    );

  grid.innerHTML = `
    <div class="state-box">
      <div class="state-icon">⏳</div>

      <p class="state-title">
        Memuat teman MEXA
      </p>

      <p class="state-text">
        Menghubungkan ke sistem teman...
      </p>
    </div>
  `;


  currentUserId =
    getCurrentUserId();


  if(!currentUserId){

    grid.innerHTML = `
      <div class="state-box">

        <div class="state-icon">
          🔐
        </div>

        <p class="state-title">
          Sesi MEXA belum terbaca
        </p>

        <p class="state-text">
          Silakan masuk kembali ke MEXA
          agar daftar teman dapat dimuat otomatis.
        </p>

      </div>
    `;

    updateFriendCount(0);

    return;
  }


  const result =
    await mexaAPI(
      "get_friends",
      {
        user_id:
          currentUserId
      }
    );


  if(
    !result ||
    !result.success
  ){

    console.error(
      "GET FRIENDS ERROR:",
      result
    );

    grid.innerHTML = `
      <div class="state-box">

        <div class="state-icon">
          ⚠️
        </div>

        <p class="state-title">
          Teman belum dapat dimuat
        </p>

        <p class="state-text">
          ${
            escapeHTML(
              result?.error ||
              "Terjadi kesalahan."
            )
          }
        </p>

      </div>
    `;

    updateFriendCount(0);

    return;
  }


  mexaFriends =
    Array.isArray(
      result.friends
    )
      ? result.friends
      : [];


  /*
   * Bersihkan pilihan lama
   */

  selectedFriends = [];


  renderFriends(
    mexaFriends
  );
}


/* =========================================================
   RENDER TEMAN
   ========================================================= */

function renderFriends(
  friends
){

  const grid =
    document.getElementById(
      "friendGrid"
    );

  updateFriendCount(
    friends.length
  );


  if(!friends.length){

    grid.innerHTML = `
      <div class="state-box">

        <div class="state-icon">
          🤝
        </div>

        <p class="state-title">
          Belum ada teman MEXA
        </p>

        <p class="state-text">
          Teman akan muncul otomatis
          setelah kamu dan pengguna lain
          saling mengikuti.
        </p>

      </div>
    `;

    updateSendBar();

    return;
  }


  grid.innerHTML =
    friends.map(
      friend => {

        const id =
          friend.id ||
          friend.user_id ||
          friend.userId;


        const name =
          friend.display_name ||
          friend.name ||
          friend.username ||
          "";


        const username =
          friend.username ||
          "";


        const avatar =
          friend.avatar_url ||
          friend.avatar ||
          "";


        const selected =
          selectedFriends.includes(
            id
          );


        return `

          <article
            class="friend-card ${
              selected
                ? "selected"
                : ""
            }"
            data-friend-id="${escapeHTML(id || "")}"
            onclick="toggleFriend('${escapeJS(id || "")}')"
          >

            <div class="friend-avatar-wrap">

              <img
                class="friend-avatar"
                src="${escapeHTML(
                  avatar ||
                  createAvatar(name)
                )}"
                alt="${escapeHTML(name)}"
                onerror="
                  this.src =
                  '${escapeHTML(
                    createAvatar(name)
                  )}'
                "
              >

              <span
                class="friend-online"
              ></span>

            </div>


            <div class="friend-info">

              <div class="friend-name">
                ${escapeHTML(
                  name
                )}
              </div>

              ${
                username
                  ? `
                    <div class="friend-username">
                      @${escapeHTML(
                        username
                      )}
                    </div>
                  `
                  : ""
              }

            </div>


            <div class="friend-check">
              ✓
            </div>

          </article>

        `;
      }
    ).join("");


  updateSendBar();
}


/* =========================================================
   SEARCH
   ========================================================= */

document
  .getElementById(
    "friendSearch"
  )
  .addEventListener(
    "input",
    function(){

      const keyword =
        this.value
          .trim()
          .toLowerCase();


      if(!keyword){

        renderFriends(
          mexaFriends
        );

        return;
      }


      const filtered =
        mexaFriends.filter(
          friend => {

            const name =
              (
                friend.display_name ||
                friend.name ||
                ""
              ).toLowerCase();

            const username =
              (
                friend.username ||
                ""
              ).toLowerCase();

            return (
              name.includes(
                keyword
              ) ||
              username.includes(
                keyword
              )
            );
          }
        );


      renderFriends(
        filtered
      );
    }
  );


/* =========================================================
   PILIH TEMAN
   ========================================================= */

function toggleFriend(
  friendId
){

  if(!friendId) return;


  const index =
    selectedFriends.indexOf(
      friendId
    );


  if(index >= 0){

    selectedFriends.splice(
      index,
      1
    );

  }else{

    selectedFriends.push(
      friendId
    );
  }


  /*
   * Render berdasarkan seluruh
   * daftar teman agar pilihan
   * tetap terlihat saat search.
   */

  const keyword =
    document
      .getElementById(
        "friendSearch"
      )
      .value
      .trim()
      .toLowerCase();


  if(keyword){

    const filtered =
      mexaFriends.filter(
        friend => {

          const name =
            (
              friend.display_name ||
              friend.name ||
              ""
            ).toLowerCase();

          const username =
            (
              friend.username ||
              ""
            ).toLowerCase();

          return (
            name.includes(
              keyword
            ) ||
            username.includes(
              keyword
            )
          );
        }
      );

    renderFriends(
      filtered
    );

  }else{

    renderFriends(
      mexaFriends
    );
  }
}


/* =========================================================
   SEND BAR
   ========================================================= */

function updateSendBar(){

  const bar =
    document.getElementById(
      "sendBar"
    );

  const title =
    document.getElementById(
      "sendTitle"
    );

  const subtitle =
    document.getElementById(
      "sendSubtitle"
    );

  const button =
    document.getElementById(
      "sendButton"
    );


  const count =
    selectedFriends.length;


  if(count <= 0){

    bar.classList.remove(
      "show"
    );

    button.disabled =
      true;

    title.textContent =
      "Belum memilih teman";

    subtitle.textContent =
      "Pilih satu atau beberapa teman";

    return;
  }


  bar.classList.add(
    "show"
  );

  button.disabled =
    false;


  title.textContent =
    count +
    " teman dipilih";


  subtitle.textContent =
    "Postingan siap dikirim";
}


/* =========================================================
   KIRIM POST KE TEMAN
   ========================================================= */

async function sendPostToFriends(){

  if(!postId){

    showToast(
      "Postingan tidak ditemukan."
    );

    return;
  }


  if(!currentUserId){

    showToast(
      "Sesi MEXA belum terbaca."
    );

    return;
  }


  if(!selectedFriends.length){

    showToast(
      "Pilih minimal satu teman."
    );

    return;
  }


  const button =
    document.getElementById(
      "sendButton"
    );


  const oldText =
    button.textContent;


  button.disabled = true;

  button.textContent =
    "Mengirim...";


  try{

    const result =
      await mexaAPI(
        "send_post_to_friends",
        {
          post_id:
            postId,

          user_id:
            currentUserId,

          friend_ids:
            selectedFriends
        }
      );


    if(
      !result ||
      !result.success
    ){

      showToast(
        result?.error ||
        "Postingan gagal dikirim."
      );

      return;
    }


    const sentCount =
      Number(
        result.sent_count || 0
      );


    if(sentCount > 0){

      showToast(
        sentCount === 1
          ? "Postingan berhasil dikirim ke 1 teman."
          : `Postingan berhasil dikirim ke ${sentCount} teman.`
      );

    }else{

      showToast(
        "Postingan sudah pernah dikirim ke teman yang dipilih."
      );
    }


    /*
     * Bersihkan pilihan
     */

    selectedFriends = [];


    /*
     * Render ulang
     */

    const keyword =
      document
        .getElementById(
          "friendSearch"
        )
        .value
        .trim()
        .toLowerCase();


    if(keyword){

      const filtered =
        mexaFriends.filter(
          friend => {

            const name =
              (
                friend.display_name ||
                friend.name ||
                ""
              ).toLowerCase();


            const username =
              (
                friend.username ||
                ""
              ).toLowerCase();


            return (
              name.includes(
                keyword
              ) ||
              username.includes(
                keyword
              )
            );
          }
        );


      renderFriends(
        filtered
      );

    }else{

      renderFriends(
        mexaFriends
      );
    }


  }catch(error){

    console.error(
      "SEND POST ERROR:",
      error
    );


    showToast(
      "Terjadi kesalahan saat mengirim."
    );


  }finally{

    button.disabled =
      selectedFriends.length === 0;

    button.textContent =
      oldText;
  }
}

/* =========================================================
   AVATAR DEFAULT
   ========================================================= */

function createAvatar(
  name
){

  const letter =
    (
      name ||
      "M"
    )
      .trim()
      .charAt(0)
      .toUpperCase() ||
      "M";


  return (
    "data:image/svg+xml," +
    encodeURIComponent(`
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="120"
        height="120"
        viewBox="0 0 120 120"
      >

        <rect
          width="120"
          height="120"
          rx="32"
          fill="#eef0f3"
        />

        <text
          x="60"
          y="72"
          text-anchor="middle"
          font-size="48"
          font-family="Arial"
          font-weight="700"
          fill="#111827"
        >
          ${letter}
        </text>

      </svg>
    `)
  );
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


function escapeJS(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );
}

/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;

function showToast(
  message
){

  const toast =
    document.getElementById(
      "mexaToast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      2800
    );
}
